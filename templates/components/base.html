<!DOCTYPE html>
<html lang="en" class="h-full bg-gray-50">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}GrowFolio CMS{% endblock %}</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#1F4E78',
                        secondary: '#2D3748',
                        success: '#10B981',
                        warning: '#F59E0B',
                        danger: '#EF4444',
                    }
                }
            }
        }
    </script>

    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>

    <!-- Axios -->
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

    <!-- Toastify -->
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/toastify-js"></script>

    <!-- Custom CSS -->
    <style>
        /* Smooth transitions */
        * {
            transition: background-color 0.2s ease, border-color 0.2s ease, color 0.2s ease;
        }

        /* Scrollbar styling */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f1f1;
        }
        ::-webkit-scrollbar-thumb {
            background: #888;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #555;
        }

        /* Loading overlay */
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
        }

        /* Spinner animation */
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #1F4E78;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>

    {% block head %}{% endblock %}
</head>
<body class="h-full" x-data="{ sidebarOpen: true, userMenuOpen: false, userRole: localStorage.getItem('user_role') || '' }">
    <!-- Authentication Check -->
    <script>
        // Check authentication on page load
        (function() {
            const token = localStorage.getItem('access_token');
            const currentPath = window.location.pathname;

            // If no token and not on login/change-password page, redirect to login
            if (!token && currentPath !== '/' && currentPath !== '/login' && currentPath !== '/change-password') {
                window.location.href = '/login';
            }

            // If token exists and on login page, redirect to dashboard
            if (token && (currentPath === '/' || currentPath === '/login')) {
                window.location.href = '/dashboard';
            }
        })();
    </script>

    <!-- Loading Overlay -->
    <div id="loadingOverlay" class="loading-overlay hidden">
        <div class="bg-white p-6 rounded-lg shadow-xl">
            <div class="spinner mx-auto"></div>
            <p class="mt-4 text-gray-700 font-medium">Loading...</p>
        </div>
    </div>

    <div class="flex h-full">
        <!-- Sidebar -->
        <aside
            :class="sidebarOpen ? 'translate-x-0' : '-translate-x-full'"
            class="fixed inset-y-0 left-0 z-50 w-64 bg-primary transform transition-transform duration-300 ease-in-out lg:translate-x-0 lg:static lg:inset-0"
        >
            <!-- Logo -->
            <div class="flex items-center justify-center h-16 bg-primary border-b border-blue-900">
                <h1 class="text-white text-xl font-bold">GrowFolio CMS</h1>
            </div>

            <!-- Navigation -->
            <nav class="mt-6 px-3">
                <a href="/dashboard" class="flex items-center px-4 py-3 mb-2 text-white hover:bg-blue-800 rounded-lg {% if request.url.path == '/dashboard' %}bg-blue-800{% endif %}">
                    <i class="fas fa-chart-line w-5"></i>
                    <span class="ml-3">Dashboard</span>
                </a>

                <a href="/customers" class="flex items-center px-4 py-3 mb-2 text-white hover:bg-blue-800 rounded-lg {% if '/customers' in request.url.path %}bg-blue-800{% endif %}">
                    <i class="fas fa-users w-5"></i>
                    <span class="ml-3">Customers</span>
                </a>

                <a href="/calendar" class="flex items-center px-4 py-3 mb-2 text-white hover:bg-blue-800 rounded-lg {% if request.url.path == '/calendar' %}bg-blue-800{% endif %}">
                    <i class="fas fa-calendar w-5"></i>
                    <span class="ml-3">Calendar</span>
                </a>

                <a href="/documents" class="flex items-center px-4 py-3 mb-2 text-white hover:bg-blue-800 rounded-lg {% if request.url.path == '/documents' %}bg-blue-800{% endif %}">
                    <i class="fas fa-folder w-5"></i>
                    <span class="ml-3">Documents</span>
                </a>

                <!-- Prospects (Admin Only) -->
                <div x-show="userRole === 'ADMIN'">
                    <a href="/prospects" class="flex items-center px-4 py-3 mb-2 text-white hover:bg-blue-800 rounded-lg {% if '/prospects' in request.url.path %}bg-blue-800{% endif %}">
                        <i class="fas fa-user-plus w-5"></i>
                        <span class="ml-3">Prospects</span>
                    </a>

                    <a href="/questionnaire-invites" class="flex items-center px-4 py-3 mb-2 text-white hover:bg-blue-800 rounded-lg {% if '/questionnaire' in request.url.path %}bg-blue-800{% endif %}">
                        <i class="fas fa-clipboard-list w-5"></i>
                        <span class="ml-3">Client Profiling</span>
                    </a>
                </div>

                <div class="mt-2 pt-2 border-t border-blue-900">
                    <p class="px-4 text-xs font-semibold text-blue-300 uppercase tracking-wider mb-2">Billing</p>

                    <a href="/billing/commissions" class="flex items-center px-4 py-3 mb-2 text-white hover:bg-blue-800 rounded-lg {% if request.url.path == '/billing/commissions' %}bg-blue-800{% endif %}">
                        <i class="fas fa-coins w-5"></i>
                        <span class="ml-3">Commissions</span>
                    </a>

                    <a href="/billing/invoices" class="flex items-center px-4 py-3 mb-2 text-white hover:bg-blue-800 rounded-lg {% if request.url.path == '/billing/invoices' %}bg-blue-800{% endif %}">
                        <i class="fas fa-file-invoice w-5"></i>
                        <span class="ml-3">Invoices</span>
                    </a>
                </div>

                <div class="mt-2 pt-2 border-t border-blue-900">
                    <a href="/reports" class="flex items-center px-4 py-3 mb-2 text-white hover:bg-blue-800 rounded-lg {% if request.url.path == '/reports' %}bg-blue-800{% endif %}">
                        <i class="fas fa-chart-bar w-5"></i>
                        <span class="ml-3">Reports</span>
                    </a>

                    <!-- Users (Admin Only) -->
                    <a href="/users" class="flex items-center px-4 py-3 mb-2 text-white hover:bg-blue-800 rounded-lg {% if request.url.path == '/users' %}bg-blue-800{% endif %}" x-show="userRole === 'ADMIN'">
                        <i class="fas fa-users-cog w-5"></i>
                        <span class="ml-3">Users</span>
                    </a>
                </div>
            </nav>
        </aside>

        <!-- Main Content -->
        <div class="flex-1 flex flex-col overflow-hidden">
            <!-- Top Bar -->
            <header class="bg-white shadow-sm z-10">
                <div class="flex items-center justify-between px-6 py-4">
                    <!-- Mobile menu button -->
                    <button
                        @click="sidebarOpen = !sidebarOpen"
                        class="text-gray-500 focus:outline-none lg:hidden"
                    >
                        <i class="fas fa-bars text-xl"></i>
                    </button>

                    <!-- Page title placeholder -->
                    <div class="flex-1">
                        <h2 class="text-xl font-semibold text-gray-800 hidden sm:block">{% block page_title %}{% endblock %}</h2>
                    </div>

                    <!-- User menu -->
                    <div class="relative" x-data="{ open: false }">
                        <button
                            @click="open = !open"
                            class="flex items-center text-sm focus:outline-none"
                        >
                            <div class="w-8 h-8 rounded-full bg-primary text-white flex items-center justify-center">
                                <i class="fas fa-user"></i>
                            </div>
                            <span class="ml-3 text-gray-700 font-medium hidden md:block" id="userName">Admin</span>
                            <i class="fas fa-chevron-down ml-2 text-gray-500"></i>
                        </button>

                        <div
                            x-show="open"
                            @click.away="open = false"
                            x-transition
                            class="absolute right-0 mt-2 w-48 bg-white rounded-lg shadow-lg py-2 z-50"
                            style="display: none;"
                        >
                            <a href="#" onclick="openChangePassword()" class="block px-4 py-2 text-gray-800 hover:bg-gray-100">
                                <i class="fas fa-key mr-2"></i> Change Password
                            </a>
                            <div class="border-t border-gray-200 my-1"></div>
                            <a href="#" onclick="logout()" class="block px-4 py-2 text-red-600 hover:bg-gray-100">
                                <i class="fas fa-sign-out-alt mr-2"></i> Logout
                            </a>
                        </div>
                    </div>
                </div>
            </header>

            <!-- Page Content -->
            <main class="flex-1 overflow-auto bg-gray-50 p-6">
                {% block content %}{% endblock %}
            </main>
        </div>
    </div>

    <!-- Mobile sidebar overlay -->
    <div
        x-show="sidebarOpen && window.innerWidth < 1024"
        @click="sidebarOpen = false"
        class="fixed inset-0 bg-black bg-opacity-50 z-40 lg:hidden"
        style="display: none;"
    ></div>

    <!-- Base JavaScript -->
    <script>
        // API Base URL
        const API_URL = '/api';

        // Get JWT token from localStorage
        function getToken() {
            return localStorage.getItem('access_token');
        }

        // Set JWT token
        function setToken(token) {
            localStorage.setItem('access_token', token);
        }

        // Remove JWT token
        function removeToken() {
            localStorage.removeItem('access_token');
        }

        // Configure Axios defaults
        axios.interceptors.request.use(config => {
            const token = getToken();
            if (token) {
                config.headers.Authorization = `Bearer ${token}`;
            }
            return config;
        });

        // Handle 401 errors (redirect to login)
        axios.interceptors.response.use(
            response => response,
            error => {
                if (error.response && error.response.status === 401) {
                    removeToken();
                    window.location.href = '/login';
                }
                return Promise.reject(error);
            }
        );

        // Show loading overlay
        function showLoading() {
            document.getElementById('loadingOverlay').classList.remove('hidden');
        }

        // Hide loading overlay
        function hideLoading() {
            document.getElementById('loadingOverlay').classList.add('hidden');
        }

        // Show toast notification
        function showToast(message, type = 'success') {
            const bgColor = {
                success: 'linear-gradient(to right, #10B981, #059669)',
                error: 'linear-gradient(to right, #EF4444, #DC2626)',
                warning: 'linear-gradient(to right, #F59E0B, #D97706)',
                info: 'linear-gradient(to right, #3B82F6, #2563EB)'
            };

            Toastify({
                text: message,
                duration: 3000,
                gravity: "top",
                position: "right",
                style: {
                    background: bgColor[type] || bgColor.success,
                },
            }).showToast();
        }

        // Format currency
        function formatCurrency(amount) {
            return new Intl.NumberFormat('en-IN', {
                style: 'currency',
                currency: 'INR',
                minimumFractionDigits: 0,
                maximumFractionDigits: 0
            }).format(amount);
        }

        // Format percentage
        function formatPercentage(value) {
            return `${value >= 0 ? '+' : ''}${value.toFixed(2)}%`;
        }

        // Format date
        function formatDate(dateString) {
            const date = new Date(dateString);
            return date.toLocaleDateString('en-IN', {
                year: 'numeric',
                month: 'short',
                day: 'numeric'
            });
        }

        // Format datetime
        function formatDateTime(dateString) {
            const date = new Date(dateString);
            return date.toLocaleString('en-IN', {
                year: 'numeric',
                month: 'short',
                day: 'numeric',
                hour: '2-digit',
                minute: '2-digit'
            });
        }

        // Logout function
        async function logout() {
            if (confirm('Are you sure you want to logout?')) {
                removeToken();
                window.location.href = '/login';
            }
        }

        // Open change password modal/page
        function openChangePassword() {
            window.location.href = '/change-password';
        }

        // Load current user info
        async function loadUserInfo() {
            try {
                const response = await axios.get(`${API_URL}/auth/me`);
                document.getElementById('userName').textContent = response.data.full_name;
                // Store user role for sidebar visibility
                localStorage.setItem('user_role', response.data.role);
                // Update Alpine.js data
                if (window.Alpine) {
                    window.Alpine.store('userRole', response.data.role);
                }
            } catch (error) {
                console.error('Error loading user info:', error);
            }
        }

        // Check if user is authenticated
        function checkAuth() {
            const token = getToken();
            if (!token && !window.location.pathname.includes('/login')) {
                window.location.href = '/login';
            }
            if (token && window.location.pathname.includes('/login')) {
                window.location.href = '/dashboard';
            }
        }

        // Initialize on page load
        document.addEventListener('DOMContentLoaded', () => {
            checkAuth();
            if (getToken()) {
                loadUserInfo();
            }
        });
    </script>

    {% block scripts %}{% endblock %}
</body>
</html>

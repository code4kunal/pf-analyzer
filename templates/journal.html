{% extends "base.html" %}

{% block title %}Trading Journal - Portfolio Analyzer{% endblock %}

{% block content %}
<div class="header">
    <h1 class="page-title">Trading Journal</h1>
    <p class="page-subtitle">Document your trades and learn from your experiences</p>
</div>

<!-- Add Entry Button -->
<div style="margin-bottom: 2rem;">
    <button class="btn btn-primary" onclick="showAddEntryModal()">
        <i class="fas fa-plus"></i> New Journal Entry
    </button>
</div>

<!-- Journal Entries -->
<div id="journalEntries">
    <!-- Entries will be loaded here -->
</div>

<!-- Add/Edit Entry Modal -->
<div class="modal" id="journalModal">
    <div class="modal-content" style="max-width: 700px;">
        <div class="modal-header">
            <h2 class="modal-title" id="modalTitle">New Journal Entry</h2>
            <button class="modal-close" onclick="closeJournalModal()">&times;</button>
        </div>
        <form id="journalForm">
            <input type="hidden" id="entryId">

            <div class="form-group">
                <label class="form-label">Entry Date</label>
                <input type="date" class="form-control" id="entryDate" required>
            </div>

            <div class="form-group">
                <label class="form-label">Title</label>
                <input type="text" class="form-control" id="entryTitle" placeholder="e.g., RELIANCE Swing Trade" required>
            </div>

            <div class="form-group">
                <label class="form-label">Strategy</label>
                <input type="text" class="form-control" id="entryStrategy" placeholder="e.g., Breakout, Mean Reversion">
            </div>

            <div class="form-group">
                <label class="form-label">Entry Reason</label>
                <textarea class="form-control" id="entryReason" rows="3" placeholder="Why did you enter this trade?"></textarea>
            </div>

            <div class="form-group">
                <label class="form-label">Exit Reason</label>
                <textarea class="form-control" id="exitReason" rows="3" placeholder="Why did you exit this trade?"></textarea>
            </div>

            <div class="form-group">
                <label class="form-label">Market Condition</label>
                <textarea class="form-control" id="marketCondition" rows="2" placeholder="Describe the market conditions"></textarea>
            </div>

            <div class="form-group">
                <label class="form-label">Mistakes</label>
                <textarea class="form-control" id="mistakes" rows="2" placeholder="What mistakes did you make?"></textarea>
            </div>

            <div class="form-group">
                <label class="form-label">Learnings</label>
                <textarea class="form-control" id="learnings" rows="2" placeholder="What did you learn from this trade?"></textarea>
            </div>

            <div class="form-group">
                <label class="form-label">Emotions</label>
                <input type="text" class="form-control" id="emotions" placeholder="e.g., Confident, Anxious, FOMO">
            </div>

            <div style="display: flex; gap: 1rem;">
                <div class="form-group" style="flex: 1;">
                    <label class="form-label">Rating (1-5)</label>
                    <select class="form-control" id="rating">
                        <option value="">Select Rating</option>
                        <option value="1">1 - Poor</option>
                        <option value="2">2 - Below Average</option>
                        <option value="3">3 - Average</option>
                        <option value="4">4 - Good</option>
                        <option value="5">5 - Excellent</option>
                    </select>
                </div>

                <div class="form-group" style="flex: 1;">
                    <label class="form-label">Followed Rules?</label>
                    <select class="form-control" id="followedRules">
                        <option value="true">Yes</option>
                        <option value="false">No</option>
                    </select>
                </div>
            </div>

            <div style="display: flex; gap: 1rem;">
                <button type="submit" class="btn btn-primary">Save Entry</button>
                <button type="button" class="btn btn-outline" onclick="closeJournalModal()">Cancel</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
let editingEntryId = null;

// Load journal entries
async function loadJournalEntries() {
    try {
        const response = await axios.get(`${API_URL}/journal`);
        const entries = response.data;

        const container = document.getElementById('journalEntries');
        container.innerHTML = '';

        if (entries.length === 0) {
            container.innerHTML = `
                <div class="card" style="text-align: center; padding: 3rem;">
                    <i class="fas fa-book" style="font-size: 3rem; color: var(--text-secondary); margin-bottom: 1rem;"></i>
                    <h3>No Journal Entries Yet</h3>
                    <p style="color: var(--text-secondary);">Start documenting your trades to track your progress and learnings.</p>
                </div>
            `;
            return;
        }

        entries.forEach(entry => {
            const entryDate = new Date(entry.entry_date).toLocaleDateString();
            const ratingStars = entry.rating ? '⭐'.repeat(entry.rating) : '';

            const entryCard = document.createElement('div');
            entryCard.className = 'card';
            entryCard.style.marginBottom = '1.5rem';
            entryCard.innerHTML = `
                <div style="display: flex; justify-content: space-between; align-items: start; margin-bottom: 1rem;">
                    <div>
                        <h3 style="margin-bottom: 0.5rem;">${entry.title}</h3>
                        <div style="display: flex; gap: 1rem; font-size: 0.875rem; color: var(--text-secondary);">
                            <span><i class="fas fa-calendar"></i> ${entryDate}</span>
                            ${entry.strategy ? `<span><i class="fas fa-chess"></i> ${entry.strategy}</span>` : ''}
                            ${ratingStars ? `<span>${ratingStars}</span>` : ''}
                            ${entry.followed_rules ?
                                '<span style="color: var(--success-color);"><i class="fas fa-check-circle"></i> Rules Followed</span>' :
                                '<span style="color: var(--danger-color);"><i class="fas fa-times-circle"></i> Rules Broken</span>'}
                        </div>
                    </div>
                    <div style="display: flex; gap: 0.5rem;">
                        <button class="btn btn-outline" onclick="editEntry(${entry.id})" title="Edit">
                            <i class="fas fa-edit"></i>
                        </button>
                        <button class="btn btn-outline" onclick="deleteEntry(${entry.id})" title="Delete">
                            <i class="fas fa-trash"></i>
                        </button>
                    </div>
                </div>

                ${entry.entry_reason ? `
                <div style="margin-bottom: 1rem;">
                    <h4 style="font-size: 0.875rem; color: var(--text-secondary); margin-bottom: 0.5rem;">Entry Reason</h4>
                    <p>${entry.entry_reason}</p>
                </div>` : ''}

                ${entry.exit_reason ? `
                <div style="margin-bottom: 1rem;">
                    <h4 style="font-size: 0.875rem; color: var(--text-secondary); margin-bottom: 0.5rem;">Exit Reason</h4>
                    <p>${entry.exit_reason}</p>
                </div>` : ''}

                ${entry.learnings ? `
                <div style="margin-bottom: 1rem;">
                    <h4 style="font-size: 0.875rem; color: var(--text-secondary); margin-bottom: 0.5rem;">Learnings</h4>
                    <p>${entry.learnings}</p>
                </div>` : ''}

                ${entry.mistakes ? `
                <div style="margin-bottom: 1rem;">
                    <h4 style="font-size: 0.875rem; color: var(--danger-color); margin-bottom: 0.5rem;">Mistakes</h4>
                    <p>${entry.mistakes}</p>
                </div>` : ''}

                ${entry.emotions ? `
                <div style="margin-top: 1rem; padding-top: 1rem; border-top: 1px solid var(--border-color);">
                    <span style="font-size: 0.875rem; color: var(--text-secondary);">
                        <i class="fas fa-heart"></i> Emotions: ${entry.emotions}
                    </span>
                </div>` : ''}
            `;
            container.appendChild(entryCard);
        });
    } catch (error) {
        console.error('Failed to load journal entries:', error);
    }
}

// Show add entry modal
function showAddEntryModal() {
    editingEntryId = null;
    document.getElementById('modalTitle').textContent = 'New Journal Entry';
    document.getElementById('journalForm').reset();
    document.getElementById('entryDate').value = new Date().toISOString().split('T')[0];
    document.getElementById('followedRules').value = 'true';
    document.getElementById('journalModal').classList.add('show');
}

// Close journal modal
function closeJournalModal() {
    document.getElementById('journalModal').classList.remove('show');
    editingEntryId = null;
}

// Edit entry
async function editEntry(entryId) {
    try {
        const response = await axios.get(`${API_URL}/journal`);
        const entry = response.data.find(e => e.id === entryId);

        if (entry) {
            editingEntryId = entryId;
            document.getElementById('modalTitle').textContent = 'Edit Journal Entry';
            document.getElementById('entryDate').value = entry.entry_date;
            document.getElementById('entryTitle').value = entry.title;
            document.getElementById('entryStrategy').value = entry.strategy || '';
            document.getElementById('entryReason').value = entry.entry_reason || '';
            document.getElementById('exitReason').value = entry.exit_reason || '';
            document.getElementById('marketCondition').value = entry.market_condition || '';
            document.getElementById('mistakes').value = entry.mistakes || '';
            document.getElementById('learnings').value = entry.learnings || '';
            document.getElementById('emotions').value = entry.emotions || '';
            document.getElementById('rating').value = entry.rating || '';
            document.getElementById('followedRules').value = entry.followed_rules.toString();
            document.getElementById('journalModal').classList.add('show');
        }
    } catch (error) {
        console.error('Failed to load entry for editing:', error);
    }
}

// Delete entry
async function deleteEntry(entryId) {
    if (!confirm('Are you sure you want to delete this journal entry?')) {
        return;
    }

    try {
        await axios.delete(`${API_URL}/journal/${entryId}`);
        await loadJournalEntries();
        showNotification('Journal entry deleted successfully');
    } catch (error) {
        alert('Failed to delete entry: ' + (error.response?.data?.detail || error.message));
    }
}

// Journal form submission
document.getElementById('journalForm').addEventListener('submit', async (e) => {
    e.preventDefault();

    const entryData = {
        entry_date: document.getElementById('entryDate').value,
        title: document.getElementById('entryTitle').value,
        strategy: document.getElementById('entryStrategy').value || null,
        entry_reason: document.getElementById('entryReason').value || null,
        exit_reason: document.getElementById('exitReason').value || null,
        market_condition: document.getElementById('marketCondition').value || null,
        mistakes: document.getElementById('mistakes').value || null,
        learnings: document.getElementById('learnings').value || null,
        emotions: document.getElementById('emotions').value || null,
        rating: document.getElementById('rating').value ? parseInt(document.getElementById('rating').value) : null,
        followed_rules: document.getElementById('followedRules').value === 'true'
    };

    try {
        if (editingEntryId) {
            await axios.put(`${API_URL}/journal/${editingEntryId}`, entryData);
            showNotification('Journal entry updated successfully');
        } else {
            await axios.post(`${API_URL}/journal`, entryData);
            showNotification('Journal entry created successfully');
        }
        closeJournalModal();
        await loadJournalEntries();
    } catch (error) {
        alert('Failed to save journal entry: ' + (error.response?.data?.detail || error.message));
    }
});

// Initialize on load
window.addEventListener('DOMContentLoaded', () => {
    loadJournalEntries();

    // Check for trade_id parameter
    const urlParams = new URLSearchParams(window.location.search);
    const tradeId = urlParams.get('trade_id');
    if (tradeId) {
        showAddEntryModal();
    }
});
</script>
{% endblock %}

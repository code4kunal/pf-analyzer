<!DOCTYPE html>
<html lang="en" class="h-full bg-gradient-to-br from-primary to-blue-900">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - GrowFolio CMS</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#1F4E78',
                    }
                }
            }
        }
    </script>

    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Axios -->
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

    <!-- Toastify -->
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
</head>
<body class="h-full flex items-center justify-center p-4" x-data="loginApp()">
    <div class="w-full max-w-md">
        <!-- Login Card -->
        <div class="bg-white rounded-2xl shadow-2xl p-8">
            <!-- Logo/Header -->
            <div class="text-center mb-8">
                <div class="w-16 h-16 bg-primary rounded-full flex items-center justify-center mx-auto mb-4">
                    <i class="fas fa-chart-line text-white text-2xl"></i>
                </div>
                <h1 class="text-3xl font-bold text-gray-900">GrowFolio CMS</h1>
                <p class="text-gray-600 mt-2">Investment Advisory Platform</p>
            </div>

            <!-- Login Form -->
            <form @submit.prevent="handleLogin" class="space-y-6">
                <!-- Email Field -->
                <div>
                    <label for="email" class="block text-sm font-medium text-gray-700 mb-2">
                        <i class="fas fa-envelope mr-2 text-gray-400"></i>Email Address
                    </label>
                    <input
                        type="email"
                        id="email"
                        x-model="form.email"
                        required
                        class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary focus:border-transparent transition"
                        :class="{ 'border-red-500': errors.email }"
                        placeholder="admin@grow-folio.in"
                        @input="errors.email = ''"
                    >
                    <p x-show="errors.email" x-text="errors.email" class="mt-1 text-sm text-red-500"></p>
                </div>

                <!-- Password Field -->
                <div>
                    <label for="password" class="block text-sm font-medium text-gray-700 mb-2">
                        <i class="fas fa-lock mr-2 text-gray-400"></i>Password
                    </label>
                    <div class="relative">
                        <input
                            :type="showPassword ? 'text' : 'password'"
                            id="password"
                            x-model="form.password"
                            required
                            class="w-full px-4 py-3 pr-12 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary focus:border-transparent transition"
                            :class="{ 'border-red-500': errors.password }"
                            placeholder="••••••••"
                            @input="errors.password = ''"
                        >
                        <button
                            type="button"
                            @click="showPassword = !showPassword"
                            class="absolute right-3 top-1/2 transform -translate-y-1/2 text-gray-500 hover:text-gray-700"
                        >
                            <i :class="showPassword ? 'fas fa-eye-slash' : 'fas fa-eye'"></i>
                        </button>
                    </div>
                    <p x-show="errors.password" x-text="errors.password" class="mt-1 text-sm text-red-500"></p>
                </div>

                <!-- Remember Me -->
                <div class="flex items-center justify-between">
                    <label class="flex items-center">
                        <input
                            type="checkbox"
                            x-model="form.rememberMe"
                            class="w-4 h-4 text-primary border-gray-300 rounded focus:ring-primary"
                        >
                        <span class="ml-2 text-sm text-gray-700">Remember me</span>
                    </label>
                </div>

                <!-- Error Message -->
                <div x-show="errors.general" class="p-4 bg-red-50 border border-red-200 rounded-lg">
                    <p class="text-sm text-red-600">
                        <i class="fas fa-exclamation-circle mr-2"></i>
                        <span x-text="errors.general"></span>
                    </p>
                </div>

                <!-- Submit Button -->
                <button
                    type="submit"
                    :disabled="loading"
                    class="w-full bg-primary hover:bg-blue-900 text-white font-medium py-3 rounded-lg transition duration-200 flex items-center justify-center"
                    :class="{ 'opacity-50 cursor-not-allowed': loading }"
                >
                    <span x-show="!loading">
                        <i class="fas fa-sign-in-alt mr-2"></i>Sign In
                    </span>
                    <span x-show="loading" class="flex items-center">
                        <svg class="animate-spin h-5 w-5 mr-2 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                        </svg>
                        Signing in...
                    </span>
                </button>
            </form>

            <!-- Footer -->
            <div class="mt-8 text-center">
                <p class="text-sm text-gray-600">
                    Need help? Contact <a href="mailto:help@grow-folio.in" class="text-primary hover:underline">help@grow-folio.in</a>
                </p>
            </div>
        </div>

    </div>

    <script>
        function loginApp() {
            return {
                form: {
                    email: '',
                    password: '',
                    rememberMe: false
                },
                errors: {
                    email: '',
                    password: '',
                    general: ''
                },
                loading: false,
                showPassword: false,

                async handleLogin() {
                    // Reset errors
                    this.errors = { email: '', password: '', general: '' };

                    // Validate
                    if (!this.form.email) {
                        this.errors.email = 'Email is required';
                        return;
                    }
                    if (!this.form.password) {
                        this.errors.password = 'Password is required';
                        return;
                    }

                    this.loading = true;

                    try {
                        // Call login API
                        const response = await axios.post('/api/auth/login', {
                            email: this.form.email,
                            password: this.form.password
                        });

                        // Save token
                        localStorage.setItem('access_token', response.data.access_token);

                        // Show success message
                        Toastify({
                            text: "Login successful! Redirecting...",
                            duration: 2000,
                            gravity: "top",
                            position: "right",
                            style: {
                                background: "linear-gradient(to right, #10B981, #059669)",
                            },
                        }).showToast();

                        // Check if temp password and redirect accordingly
                        if (response.data.is_temp_password) {
                            setTimeout(() => {
                                window.location.href = '/change-password';
                            }, 1000);
                        } else {
                            setTimeout(() => {
                                window.location.href = '/dashboard';
                            }, 1000);
                        }

                    } catch (error) {
                        this.loading = false;

                        if (error.response) {
                            // Server responded with error
                            if (error.response.status === 401) {
                                this.errors.general = 'Invalid email or password';
                            } else {
                                this.errors.general = error.response.data.detail || 'An error occurred. Please try again.';
                            }
                        } else if (error.request) {
                            // Network error
                            this.errors.general = 'Unable to connect to server. Please check your internet connection.';
                        } else {
                            this.errors.general = 'An unexpected error occurred. Please try again.';
                        }

                        // Show error toast
                        Toastify({
                            text: this.errors.general,
                            duration: 4000,
                            gravity: "top",
                            position: "right",
                            style: {
                                background: "linear-gradient(to right, #EF4444, #DC2626)",
                            },
                        }).showToast();
                    }
                }
            }
        }

        // Redirect if already logged in
        document.addEventListener('DOMContentLoaded', () => {
            const token = localStorage.getItem('access_token');
            if (token) {
                window.location.href = '/dashboard';
            }
        });
    </script>
</body>
</html>

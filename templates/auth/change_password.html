<!DOCTYPE html>
<html lang="en" class="h-full bg-gradient-to-br from-primary to-blue-900">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change Password - GrowFolio CMS</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#1F4E78',
                    }
                }
            }
        }
    </script>

    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Axios -->
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

    <!-- Toastify -->
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
</head>
<body class="h-full flex items-center justify-center p-4" x-data="changePasswordApp()">
    <div class="w-full max-w-md">
        <!-- Change Password Card -->
        <div class="bg-white rounded-2xl shadow-2xl p-8">
            <!-- Header -->
            <div class="text-center mb-8">
                <div class="w-16 h-16 bg-warning rounded-full flex items-center justify-center mx-auto mb-4">
                    <i class="fas fa-key text-white text-2xl"></i>
                </div>
                <h1 class="text-3xl font-bold text-gray-900">Change Password</h1>
                <p class="text-gray-600 mt-2">Create a strong password for your account</p>
            </div>

            <!-- Alert: Temp Password -->
            <div class="mb-6 p-4 bg-yellow-50 border border-yellow-200 rounded-lg">
                <p class="text-sm text-yellow-800">
                    <i class="fas fa-exclamation-triangle mr-2"></i>
                    You are using a temporary password. Please change it to continue.
                </p>
            </div>

            <!-- Change Password Form -->
            <form @submit.prevent="handleChangePassword" class="space-y-6">
                <!-- Current Password -->
                <div>
                    <label for="currentPassword" class="block text-sm font-medium text-gray-700 mb-2">
                        Current Password
                    </label>
                    <div class="relative">
                        <input
                            :type="showCurrent ? 'text' : 'password'"
                            id="currentPassword"
                            x-model="form.current_password"
                            required
                            class="w-full px-4 py-3 pr-12 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary focus:border-transparent"
                            :class="{ 'border-red-500': errors.current_password }"
                            @input="errors.current_password = ''"
                        >
                        <button
                            type="button"
                            @click="showCurrent = !showCurrent"
                            class="absolute right-3 top-1/2 transform -translate-y-1/2 text-gray-500"
                        >
                            <i :class="showCurrent ? 'fas fa-eye-slash' : 'fas fa-eye'"></i>
                        </button>
                    </div>
                    <p x-show="errors.current_password" x-text="errors.current_password" class="mt-1 text-sm text-red-500"></p>
                </div>

                <!-- New Password -->
                <div>
                    <label for="newPassword" class="block text-sm font-medium text-gray-700 mb-2">
                        New Password
                    </label>
                    <div class="relative">
                        <input
                            :type="showNew ? 'text' : 'password'"
                            id="newPassword"
                            x-model="form.new_password"
                            required
                            class="w-full px-4 py-3 pr-12 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary focus:border-transparent"
                            :class="{ 'border-red-500': errors.new_password }"
                            @input="validatePassword"
                        >
                        <button
                            type="button"
                            @click="showNew = !showNew"
                            class="absolute right-3 top-1/2 transform -translate-y-1/2 text-gray-500"
                        >
                            <i :class="showNew ? 'fas fa-eye-slash' : 'fas fa-eye'"></i>
                        </button>
                    </div>
                    <p x-show="errors.new_password" x-text="errors.new_password" class="mt-1 text-sm text-red-500"></p>

                    <!-- Password Strength Indicator -->
                    <div class="mt-3">
                        <div class="flex items-center justify-between mb-1">
                            <span class="text-xs text-gray-600">Password Strength:</span>
                            <span class="text-xs font-medium" :class="{
                                'text-red-500': passwordStrength === 'weak',
                                'text-yellow-500': passwordStrength === 'medium',
                                'text-green-500': passwordStrength === 'strong'
                            }" x-text="passwordStrength.toUpperCase()"></span>
                        </div>
                        <div class="h-2 bg-gray-200 rounded-full overflow-hidden">
                            <div class="h-full transition-all duration-300" :class="{
                                'w-1/3 bg-red-500': passwordStrength === 'weak',
                                'w-2/3 bg-yellow-500': passwordStrength === 'medium',
                                'w-full bg-green-500': passwordStrength === 'strong'
                            }"></div>
                        </div>
                    </div>

                    <!-- Password Requirements -->
                    <ul class="mt-3 space-y-1 text-xs text-gray-600">
                        <li :class="{ 'text-green-600': passwordChecks.length }">
                            <i :class="passwordChecks.length ? 'fas fa-check' : 'fas fa-circle'" class="mr-2 text-xs"></i>
                            At least 8 characters
                        </li>
                        <li :class="{ 'text-green-600': passwordChecks.uppercase }">
                            <i :class="passwordChecks.uppercase ? 'fas fa-check' : 'fas fa-circle'" class="mr-2 text-xs"></i>
                            One uppercase letter
                        </li>
                        <li :class="{ 'text-green-600': passwordChecks.lowercase }">
                            <i :class="passwordChecks.lowercase ? 'fas fa-check' : 'fas fa-circle'" class="mr-2 text-xs"></i>
                            One lowercase letter
                        </li>
                        <li :class="{ 'text-green-600': passwordChecks.number }">
                            <i :class="passwordChecks.number ? 'fas fa-check' : 'fas fa-circle'" class="mr-2 text-xs"></i>
                            One number
                        </li>
                        <li :class="{ 'text-green-600': passwordChecks.special }">
                            <i :class="passwordChecks.special ? 'fas fa-check' : 'fas fa-circle'" class="mr-2 text-xs"></i>
                            One special character (@$!%*?&)
                        </li>
                    </ul>
                </div>

                <!-- Confirm Password -->
                <div>
                    <label for="confirmPassword" class="block text-sm font-medium text-gray-700 mb-2">
                        Confirm New Password
                    </label>
                    <div class="relative">
                        <input
                            :type="showConfirm ? 'text' : 'password'"
                            id="confirmPassword"
                            x-model="form.confirm_password"
                            required
                            class="w-full px-4 py-3 pr-12 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary focus:border-transparent"
                            :class="{ 'border-red-500': errors.confirm_password }"
                            @input="errors.confirm_password = ''"
                        >
                        <button
                            type="button"
                            @click="showConfirm = !showConfirm"
                            class="absolute right-3 top-1/2 transform -translate-y-1/2 text-gray-500"
                        >
                            <i :class="showConfirm ? 'fas fa-eye-slash' : 'fas fa-eye'"></i>
                        </button>
                    </div>
                    <p x-show="errors.confirm_password" x-text="errors.confirm_password" class="mt-1 text-sm text-red-500"></p>
                </div>

                <!-- Submit Button -->
                <button
                    type="submit"
                    :disabled="loading || passwordStrength === 'weak'"
                    class="w-full bg-primary hover:bg-blue-900 text-white font-medium py-3 rounded-lg transition duration-200 flex items-center justify-center"
                    :class="{ 'opacity-50 cursor-not-allowed': loading || passwordStrength === 'weak' }"
                >
                    <span x-show="!loading">
                        <i class="fas fa-check mr-2"></i>Change Password
                    </span>
                    <span x-show="loading" class="flex items-center">
                        <svg class="animate-spin h-5 w-5 mr-2 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                        </svg>
                        Changing Password...
                    </span>
                </button>

                <!-- Logout Link -->
                <div class="text-center">
                    <a href="#" @click.prevent="logout" class="text-sm text-gray-600 hover:text-primary">
                        <i class="fas fa-sign-out-alt mr-1"></i>Logout Instead
                    </a>
                </div>
            </form>
        </div>
    </div>

    <script>
        function changePasswordApp() {
            return {
                form: {
                    current_password: '',
                    new_password: '',
                    confirm_password: ''
                },
                errors: {
                    current_password: '',
                    new_password: '',
                    confirm_password: ''
                },
                loading: false,
                showCurrent: false,
                showNew: false,
                showConfirm: false,
                passwordStrength: '',
                passwordChecks: {
                    length: false,
                    uppercase: false,
                    lowercase: false,
                    number: false,
                    special: false
                },

                validatePassword() {
                    const pwd = this.form.new_password;
                    this.errors.new_password = '';

                    // Check requirements
                    this.passwordChecks.length = pwd.length >= 8;
                    this.passwordChecks.uppercase = /[A-Z]/.test(pwd);
                    this.passwordChecks.lowercase = /[a-z]/.test(pwd);
                    this.passwordChecks.number = /[0-9]/.test(pwd);
                    this.passwordChecks.special = /[@$!%*?&]/.test(pwd);

                    // Calculate strength
                    const checks = Object.values(this.passwordChecks).filter(v => v).length;
                    if (checks <= 2) this.passwordStrength = 'weak';
                    else if (checks <= 4) this.passwordStrength = 'medium';
                    else this.passwordStrength = 'strong';
                },

                async handleChangePassword() {
                    // Reset errors
                    this.errors = { current_password: '', new_password: '', confirm_password: '' };

                    // Validate
                    if (!this.form.current_password) {
                        this.errors.current_password = 'Current password is required';
                        return;
                    }
                    if (!this.form.new_password) {
                        this.errors.new_password = 'New password is required';
                        return;
                    }
                    if (this.passwordStrength === 'weak') {
                        this.errors.new_password = 'Please use a stronger password';
                        return;
                    }
                    if (this.form.new_password !== this.form.confirm_password) {
                        this.errors.confirm_password = 'Passwords do not match';
                        return;
                    }

                    this.loading = true;

                    try {
                        const token = localStorage.getItem('access_token');
                        const response = await axios.post('/api/auth/change-password', {
                            old_password: this.form.current_password,
                            new_password: this.form.new_password
                        }, {
                            headers: { Authorization: `Bearer ${token}` }
                        });

                        // Show success
                        Toastify({
                            text: "Password changed successfully! Redirecting...",
                            duration: 2000,
                            gravity: "top",
                            position: "right",
                            style: {
                                background: "linear-gradient(to right, #10B981, #059669)",
                            },
                        }).showToast();

                        // Redirect to dashboard
                        setTimeout(() => {
                            window.location.href = '/dashboard';
                        }, 1500);

                    } catch (error) {
                        this.loading = false;

                        let errorMsg = 'An error occurred. Please try again.';
                        if (error.response) {
                            errorMsg = error.response.data.detail || errorMsg;
                        }

                        this.errors.current_password = errorMsg;

                        Toastify({
                            text: errorMsg,
                            duration: 4000,
                            gravity: "top",
                            position: "right",
                            style: {
                                background: "linear-gradient(to right, #EF4444, #DC2626)",
                            },
                        }).showToast();
                    }
                },

                logout() {
                    localStorage.removeItem('access_token');
                    window.location.href = '/login';
                }
            }
        }

        // Check if logged in
        document.addEventListener('DOMContentLoaded', () => {
            const token = localStorage.getItem('access_token');
            if (!token) {
                window.location.href = '/login';
            }
        });

        // Configure Axios
        axios.interceptors.request.use(config => {
            const token = localStorage.getItem('access_token');
            if (token) {
                config.headers.Authorization = `Bearer ${token}`;
            }
            return config;
        });
    </script>
</body>
</html>
